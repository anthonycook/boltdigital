<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="top">
    <div class="container nav">
      <a class="brand" href="/" aria-label="Bolt Digital home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M13.8 2 6 13h5l-.8 9L18 11h-5.2L13.8 2Z"></path>
          </svg>
        </span>
        <span>Bolt Digital</span>

      <nav class="nav-links" aria-label="Primary">
        <a href="#services">Services</a>
        <a href="#work">Work</a>
        <a href="#process">Process</a>
        <a href="#contact">Contact</a>
      </nav>
      <div class="nav-actions">
       
        <a class="btn btn-secondary" href="/">Back</a>
      </div>
    </div>
  </header>
<main id="main">
    <section class="section">
      <div class="container" style="max-width: 600px; margin: 0 auto;">
        
        <div class="contact reveal visible">
          <h1>Thank You!</h1>
          <p>We will be in touch shortly and we appreciate you getting in touch with us.</p>
        </div>

 

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p>&copy; 2026 Bolt Digital.</p>
    </div>
  </footer>


<script>
    (function () {
      const header = document.querySelector('.site-header');
      const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 12);
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { 
          if (entry.isIntersecting) { 
            entry.target.classList.add('visible'); 
            observer.unobserve(entry.target); 
          } 
        });
      }, { threshold: .16 });
      
      document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));
      
      document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          const targetId = this.getAttribute('href');
          if (targetId === '#') return;
          const targetElement = document.querySelector(targetId);
          if (targetElement) {
            e.preventDefault();
            targetElement.scrollIntoView({
              behavior: 'smooth'
            });
          }
        });
      });
    })();
  </script>


</body>

</html>
